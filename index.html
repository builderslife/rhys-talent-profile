<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RHYS Talent Profile</title>
<meta name="description" content="Tes singkat untuk mengenali gaya perilaku DISC dan 5 kekuatan alami Anda.">
<meta property="og:title" content="RHYS Talent Profile">
<meta property="og:description" content="Kenali cara Anda menang: gaya perilaku DISC dan Top 5 kekuatan Anda dalam ±8 menit.">
<meta name="theme-color" content="#0B0B0C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='6' width='56' height='44' rx='14' fill='%230B0B0C'/%3E%3Cpath d='M14 46 L14 60 L28 46 Z' fill='%230B0B0C'/%3E%3Ctext x='32' y='37' font-family='Arial Black,Arial' font-weight='900' font-size='26' fill='white' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: monochrome editorial column with heavy wide uppercase type echoing the RHYS wordmark;
   one question per screen, two taps per question; the result opens with a black screenshot-sized card. */
:root{
  --bg:#F2F2F0; --surface:#FFFFFF; --ink:#0B0B0C; --muted:#6A6A67; --line:#DEDEDA; --soft:#E9E9E6;
  --on-ink:#FFFFFF;
  --d:#CF3F38; --i:#D9930D; --s:#2A8F62; --c:#335CCB;
  --display:"Archivo","Arial Black","Helvetica Neue",Arial,sans-serif;
  --body:"Geist","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
  --logo-filter:none;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0B0C; --surface:#151517; --ink:#F1F1EE; --muted:#9A9A95; --line:#2A2A2D; --soft:#1E1E21;
    --on-ink:#0B0B0C; --d:#EE645C; --i:#F0B23C; --s:#43BC86; --c:#7593F0; --logo-filter:invert(1);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0B0C; --surface:#151517; --ink:#F1F1EE; --muted:#9A9A95; --line:#2A2A2D; --soft:#1E1E21;
  --on-ink:#0B0B0C; --d:#EE645C; --i:#F0B23C; --s:#43BC86; --c:#7593F0; --logo-filter:invert(1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
.wrap.wide{max-width:960px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 0 16px;border-bottom:1px solid var(--line)}
.logo{height:22px;width:auto;filter:var(--logo-filter);display:block}
.tag{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.disp{font-family:var(--display);font-variation-settings:"wdth" 116;font-weight:850;text-transform:uppercase;letter-spacing:-.012em;line-height:.95;text-wrap:balance;margin:0}
h1.disp{font-size:clamp(42px,9vw,88px)}
h2.disp{font-size:clamp(28px,5.4vw,50px)}
h3.disp{font-size:clamp(22px,3.4vw,30px)}
.lede{font-size:clamp(17px,2.4vw,19px);color:var(--muted);max-width:56ch;margin:18px 0 0}
p{max-width:65ch}
.muted{color:var(--muted)}
.small{font-size:14px}
.bubble{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:46px;height:34px;padding:0 10px;border-radius:12px;background:var(--ink);color:var(--on-ink);font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
.bubble::after{content:"";position:absolute;left:9px;bottom:-7px;border-left:8px solid var(--ink);border-bottom:8px solid transparent}

.btn{appearance:none;border:0;border-radius:999px;padding:15px 26px;background:var(--ink);color:var(--on-ink);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;transition:transform .15s ease,opacity .15s;min-height:50px}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.28;cursor:not-allowed;transform:none}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.quiet{background:transparent;color:var(--muted);padding:15px 4px}
.btn.quiet:hover{color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* intro */
.hero{padding:48px 0 26px}
.how{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:30px 0}
.how-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.how-card b{font-family:var(--display);font-variation-settings:"wdth" 116;font-weight:800;text-transform:uppercase;font-size:17px}
.mini-opts{display:grid;gap:6px}
.mini-opts span{border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px;display:flex;justify-content:space-between;gap:8px;color:var(--muted)}
.mini-opts span.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.mini-opts span.off{border-color:var(--ink);color:var(--ink);border-style:dashed}
.mini-opts em{font-style:normal;font-family:var(--mono);font-size:11px;letter-spacing:.04em}
@media (max-width:560px){.how{grid-template-columns:1fr}}
.facts{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14px;color:var(--muted);margin-bottom:26px}
.facts b{color:var(--ink)}
form.who{display:grid;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:600;letter-spacing:.02em}
.field input{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:14px;outline:none;font-size:16px}
.field input:focus{border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.err{color:var(--d);font-size:14px;min-height:1em;margin:0}
.resume{background:var(--surface);border:1px solid var(--ink);border-radius:20px;padding:18px 20px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}

/* question */
.qhead{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:26px 0 10px}
.progress{height:3px;background:var(--soft);border-radius:3px;overflow:hidden;margin:6px 0 26px}
.progress i{display:block;height:100%;background:var(--ink);transition:width .25s ease}
.stepper{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.stepper span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.stepper span.cur{border-color:var(--ink);color:var(--ink);font-weight:600}
.stepper span.done{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.prompt{font-size:clamp(26px,5vw,40px);margin-bottom:22px}
.prompt mark{background:var(--ink);color:var(--on-ink);padding:0 .12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:18px 20px;min-height:66px;cursor:pointer;font-size:clamp(16px,2.4vw,18px);line-height:1.35;transition:border-color .12s,background .12s,transform .12s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:active:not(:disabled){transform:scale(.99)}
.opt .lb{flex:none;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:4px 10px}
.opt.most{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.opt.most .lb{background:var(--on-ink);color:var(--ink)}
.opt.least{border-color:var(--ink);border-style:dashed;color:var(--muted)}
.opt.least .txt{text-decoration:line-through;text-decoration-thickness:1px}
.opt.least .lb{background:var(--soft);color:var(--ink)}
.opt:disabled{cursor:default}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 0 60px;flex-wrap:wrap}

/* results */
.demo-banner{background:var(--ink);color:var(--on-ink);text-align:center;padding:9px 16px;font-size:13px;font-family:var(--mono);letter-spacing:.06em}
.shot-tip{display:flex;gap:12px;align-items:flex-start;padding:26px 0 16px}
.shot-tip p{margin:0}
.rcard{background:#0B0B0C;color:#F4F4F1;border-radius:28px;padding:26px 24px 22px;display:grid;gap:18px;max-width:560px;margin:0 auto;box-shadow:0 1px 0 rgba(0,0,0,.04)}
:root[data-theme="dark"] .rcard{box-shadow:inset 0 0 0 1px #2A2A2D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rcard{box-shadow:inset 0 0 0 1px #2A2A2D}}
.rcard .top-row{display:flex;justify-content:space-between;align-items:center}
.rcard .logo{height:20px}
.rcard .k{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#9A9A95}
.rcard .nm{font-family:var(--display);font-variation-settings:"wdth" 116;font-weight:850;text-transform:uppercase;font-size:clamp(28px,7vw,40px);line-height:.95;letter-spacing:-.01em;margin:6px 0 4px;text-wrap:balance}
.rcard ol{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid #2A2A2D}
.rcard li{display:grid;grid-template-columns:44px 1fr auto;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px solid #2A2A2D}
.rcard li .n{font-family:var(--display);font-variation-settings:"wdth" 125;font-weight:900;font-size:24px;line-height:1}
.rcard li .t{font-family:var(--display);font-variation-settings:"wdth" 112;font-weight:800;text-transform:uppercase;font-size:clamp(18px,4.6vw,22px);line-height:1.05}
.rcard li .d{font-size:12px;color:#9A9A95}
.rcard .disc-row{display:flex;align-items:center;gap:14px}
.rcard .sw{display:flex;gap:4px}
.rcard .sw span{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:20px;color:#fff}
.rcard .foot{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:#9A9A95;flex-wrap:wrap}

.meta{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:20px;font-size:14px;color:var(--muted)}
section.blk{padding:52px 0 8px}
.sec-h{display:flex;align-items:baseline;gap:14px;margin-bottom:8px}
.sec-n{font-family:var(--mono);font-size:13px;color:var(--muted)}
.top{display:grid;grid-template-columns:110px 1fr;gap:10px 26px;padding:32px 0;border-bottom:1px solid var(--line)}
.top:last-child{border-bottom:0}
.rank{font-family:var(--display);font-variation-settings:"wdth" 125;font-weight:900;font-size:84px;line-height:.82;letter-spacing:-.04em}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:500;margin-left:8px;vertical-align:middle;font-family:var(--body);text-transform:none;letter-spacing:0}
.top .desc{font-size:18px;margin:12px 0 0}
.facets{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.facet{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.facet.full{grid-column:1/-1}
.facet h4{margin:0 0 8px;font-size:12px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.facet p,.facet ul{margin:0;font-size:15px}
.facet ul{padding-left:18px;display:grid;gap:4px}
@media (max-width:680px){.top{grid-template-columns:1fr;gap:6px}.rank{font-size:60px}.facets{grid-template-columns:1fr}}
.tie{font-size:14px;color:var(--muted);border-left:3px solid var(--ink);padding:4px 0 4px 12px;margin-top:8px}

.domains{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}
.dom{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px}
.dom.lead{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dom .n{font-family:var(--display);font-variation-settings:"wdth" 116;font-weight:800;text-transform:uppercase;font-size:17px}
.dom .cnt{font-family:var(--display);font-variation-settings:"wdth" 125;font-weight:900;font-size:44px;line-height:.9;font-variant-numeric:tabular-nums}
.pips{display:flex;gap:4px}.pips i{width:16px;height:6px;border-radius:3px;background:var(--soft)}.pips i.on{background:var(--ink)}
@media (max-width:760px){.domains{grid-template-columns:1fr 1fr}}

.disc-wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:26px;margin-top:22px;align-items:start}
@media (max-width:760px){.disc-wrap{grid-template-columns:1fr}}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.bar{display:grid;grid-template-columns:34px 1fr 36px;align-items:center;gap:12px;padding:10px 0}
.letter{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:900;font-size:18px}
.track{position:relative;height:16px;background:var(--soft);border-radius:8px}
.track::before{content:"";position:absolute;left:50%;top:-6px;bottom:-6px;width:1px;background:var(--muted);opacity:.6}
.fill{position:absolute;top:0;bottom:0;border-radius:8px}
.val{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;font-size:14px}
.axis{display:grid;grid-template-columns:34px 1fr 36px;gap:12px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.axis div{display:flex;justify-content:space-between}
.style-name{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.swatch{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:900;font-size:26px;flex:none}

.list{display:grid;margin-top:18px;border-top:1px solid var(--line)}
.li{display:grid;grid-template-columns:40px 1fr 140px 40px;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.li .no{font-family:var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.li .mini{height:6px;background:var(--soft);border-radius:3px;position:relative;overflow:hidden}
.li .mini i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:3px}
.li .sc{font-family:var(--mono);font-size:13px;text-align:right;color:var(--muted)}
@media (max-width:560px){.li{grid-template-columns:32px 1fr 64px}.li .sc{display:none}}
.final{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;display:grid;gap:14px;margin-top:20px}
.note{font-size:13px;color:var(--muted);border-top:1px solid var(--line);margin-top:46px;padding:22px 0 70px}

.btn.sm{padding:11px 18px;min-height:42px;font-size:14px}
.rcard{position:relative;overflow:hidden;padding-top:34px}
.rcard .band{position:absolute;left:0;right:0;top:0;height:10px;display:flex}
.rcard .band i{display:block;height:100%}
.rcard li .n{color:var(--pc)}
.rcard .legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:12px;color:#B9B9B4}
.rcard .legend span{display:inline-flex;align-items:center;gap:7px}
.rcard .legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.how-send{margin:0;padding-left:20px;display:grid;gap:6px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center;z-index:10}
.toast.show{opacity:1}
/* ---------- PDF pages (fixed A4 at 96dpi, always light) ---------- */
.pdf-root{position:fixed;left:-10000px;top:0;width:794px;z-index:-1;
  --bg:#FFFFFF;--surface:#F6F6F4;--ink:#0B0B0C;--muted:#5F5F5C;--line:#E2E2DE;--soft:#ECECE9;--on-ink:#FFFFFF;
  --d:#CF3F38;--i:#D9930D;--s:#2A8F62;--c:#335CCB;--logo-filter:none;color:#0B0B0C;font-family:var(--body);font-size:14px;line-height:1.5}
.pdf-root .disp{font-variation-settings:normal}
.pdf-root p{max-width:none}
.pg{width:794px;height:1123px;background:#fff;padding:42px 56px 30px;display:flex;flex-direction:column;box-sizing:border-box}
.pg-h{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:24px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pg-h img{height:15px;width:auto}
.pg-c{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:18px}
.pg-f{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;margin-top:14px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.pdf-root .p-h1{font-size:52px;margin-top:10px}
.pdf-root .p-h2{font-size:34px;margin-bottom:6px}
.pdf-root .p-lead{font-size:14px;margin:8px 0 0}
.pdf-root .p-cont{display:block}
.pdf-root .p-cover .meta{margin-top:12px}
.pdf-root .rcard{max-width:520px;margin:0 auto;width:520px}
.pdf-root .rcard .nm{font-size:36px}
.pdf-root .rcard li .t{font-size:20px}
.pdf-root .p-toc ol{margin:8px 0 0;padding-left:20px;font-size:14px;display:grid;gap:2px}
.pdf-root .top{grid-template-columns:78px 1fr;gap:6px 18px;padding:16px 0;border-bottom:1px solid var(--line)}
.pdf-root .p-blk:last-child .top{border-bottom:0}
.pdf-root .rank{font-size:56px}
.pdf-root .top h3.disp{font-size:28px!important}
.pdf-root .top .desc{font-size:14.5px;margin-top:6px}
.pdf-root .facets{grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pdf-root .facet{padding:10px 12px;border-radius:12px}
.pdf-root .facet h4{font-size:9.5px;margin-bottom:4px}
.pdf-root .facet p,.pdf-root .facet ul{font-size:12.5px;line-height:1.45}
.pdf-root .facet ul{gap:2px}
.pdf-root .tie{font-size:12.5px}
.pdf-root .p-domains{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.pdf-root .dom{padding:14px}
.pdf-root .dom.lead{box-shadow:none!important;border:2px solid var(--ink)}
.pdf-root .rcard{box-shadow:none!important}
.pdf-root .chart{padding:14px 18px;margin-top:10px}
.pdf-root .style-name h3.disp{font-size:26px}
.pdf-root .p-facets2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pdf-root .li{grid-template-columns:40px 1fr 160px 40px;font-size:14px;padding:9px 0}
.pdf-root .li .sc{display:block}
.pdf-root .p-disc{font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin:10px 0 0}

.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

/* 13 blocks of 4 themes (projective plane of order 3): every pair of themes meets exactly once */
const BLOCKS=[[12,11,6,2],[11,1,0,8],[1,6,4,9],[6,0,10,3],[12,0,4,7],[11,4,10,5],[1,10,7,2],[6,7,5,8],[0,5,2,9],[4,2,8,3],[12,10,8,9],[11,7,9,3],[12,1,5,3]];

/* ============ ENGINE ============ */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const DK=["D","I","S","C"];
const QUESTIONS=(()=>{
  const r=rng(20261118);const q=[];
  DISC_GROUPS.forEach(g=>q.push({kind:"d",opts:shuffle(DK,r).map(k=>({k,t:g[k]}))}));
  const cnt=Array(13).fill(0);
  BLOCKS.forEach(b=>q.push({kind:"s",opts:shuffle(b,r).map(ti=>({k:ti,t:THEMES[ti].st[cnt[ti]++]}))}));
  return q;
})();
const NQ=QUESTIONS.length;

function compute(ans){
  const M={D:0,I:0,S:0,C:0},L={D:0,I:0,S:0,C:0};
  const sc=Array(13).fill(4),most=Array(13).fill(0);
  QUESTIONS.forEach((q,i)=>{const a=ans[i];if(!a||a.m==null||a.l==null)return;const km=q.opts[a.m].k,kl=q.opts[a.l].k;
    if(q.kind==="d"){M[km]++;L[kl]++}else{sc[km]++;sc[kl]--;most[km]++}});
  const diff={};DK.forEach(k=>diff[k]=M[k]-L[k]);
  const ord=DK.slice().sort((a,b)=>diff[b]-diff[a]||M[b]-M[a]);
  const primary=ord[0],secondary=diff[ord[1]]>0?ord[1]:null;
  const pressure=DK.slice().sort((a,b)=>L[a]-L[b]||M[b]-M[a])[0];
  const rank=[...Array(13).keys()].sort((a,b)=>sc[b]-sc[a]||most[b]-most[a]||a-b);
  return{M,L,diff,primary,secondary,pressure,sc,rank,code:primary+(secondary||"")};
}

const CLR={D:{name:"Merah",bright:"#F0625A"},I:{name:"Kuning",bright:"#F2B33A"},S:{name:"Hijau",bright:"#43BC86"},C:{name:"Biru",bright:"#7593F0"}};
function ctx(){
  const R=compute(S.ans);const top=R.rank.slice(0,5);
  const P=DIMS[R.primary],Sec=R.secondary?DIMS[R.secondary]:null,Pr=DIMS[R.pressure];
  const d5={};Object.keys(DOMAINS).forEach(k=>{d5[k]=0});top.forEach(i=>d5[THEMES[i].dom]++);
  const leadDom=Object.keys(DOMAINS).sort((a,b)=>d5[b]-d5[a])[0];
  const maxAbs=Math.max(6,...DK.map(k=>Math.abs(R.diff[k])));
  const date=new Date(S.done||Date.now()).toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});
  const tie=R.sc[R.rank[4]]===R.sc[R.rank[5]];
  return{R,top,P,Sec,Pr,d5,leadDom,maxAbs,date,tie,inviter:S.who.p?esc(S.who.p):"pengundang Anda"};
}

function discChart(c){

function styleHead(c){const {P,Sec,R}=c;return `

function rankList(c){const {R}=c;return `<div class="list">${R.rank.slice(5).map((ti,j)=>`<div class="li"><span class="no">${pad(j+6)}</span><span>${esc(THEMES[ti].name)} <span class="small muted">· ${esc(DOMAINS[THEMES[ti].dom].name)}</span></span><span class="mini"><i style="width:${R.sc[ti]/8*100}%"></i></span><span class="sc">${R.sc[ti]}/8</span></div>`).join("")}</div>`}
function domainGrid(c,cls){const {d5,leadDom}=c;return `<div class="${cls}">${Object.entries(DOMAINS).map(([k,d])=>`<div class="dom${k===leadDom?" lead":""}"><span class="tag">${esc(d.sub)}</span><span class="n">${esc(d.name)}</span><span class="cnt">${d5[k]}</span><div class="pips">${[0,1,2,3,4].map(j=>`<i class="${j<d5[k]?"on":""}"></i>`).join("")}</div><span class="small muted">dari Top 5</span></div>`).join("")}</div>`}
const TIE=c=>c.tie?`<p class="tie">Tema nomor 5 dan 6 memiliki skor yang sama, jadi keduanya sama kuatnya. Tema nomor 6 adalah <b style="color:var(--ink)">${esc(THEMES[c.R.rank[5]].name)}</b>.</p>`:"";

/* ---------- share text ---------- */
function sumText(c){
  c=c||ctx();const {R,top,P,Sec}=c;
  return `*Hasil RHYS Talent Profile*\nNama: ${S.who.n}\n\n*Top 5 kekuatan*\n${top.map((ti,j)=>`${j+1}. ${THEMES[ti].name}`).join("\n")}\n\n*Karakter dasar (DISC):* ${R.code} · ${P.alias}${Sec?" + "+Sec.alias.replace("Si ",""):""} (warna ${CLR[R.primary].name})\nDomain terkuat: ${DOMAINS[c.leadDom].name}`;
}
function waHref(c){return "https://wa.me/?text="+encodeURIComponent(sumText(c))}

/* ---------- PDF (A4, one segment per page, blocks never split) ---------- */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("Gagal memuat "+src));document.head.appendChild(s)})}
async function pdfLibs(){
  if(!window.html2canvas)await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
  if(!window.jspdf)await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
}
function pdfSegments(c){
  const {top,leadDom}=c;
  const h=(n,tag,title)=>`<div class="sec-h"><span class="sec-n">${n}</span><span class="tag">${tag}</span></div><h2 class="disp p-h2">${title}</h2>`;
  return [
    {title:"Kartu hasil",blocks:[`<div class="p-cover"><span class="tag">Laporan Talent Profile</span><h1 class="disp p-h1">${esc(S.who.n||"Peserta")}</h1>
      <div class="meta"><span>Tanggal <b>${c.date}</b></span>${S.who.p?`<span>Pengundang <b>${esc(S.who.p)}</b></span>`:""}</div></div>`,
      cardHtml(c),
      `<div class="p-toc"><span class="tag">Isi laporan</span><ol><li>Top 5 kekuatan Anda</li><li>Peta domain</li><li>Profil DISC</li><li>Urutan lengkap tema 6 sampai 13</li></ol></div>`]},
    {title:"Top 5 kekuatan Anda",blocks:[
      h("01","Hasil utama","Top 5 kekuatan Anda")+`<p class="muted p-lead">Diurutkan dari yang paling menonjol. Lima tema ini adalah cara alami Anda berpikir, merasa, dan bertindak.</p>${TIE(c)}`,
      ...top.map((ti,j)=>themeBlock(ti,j+1))]},
    {title:"Peta domain",blocks:[h("02","Peta domain","Di mana kekuatan Anda berkumpul")+domainGrid(c,"p-domains")+`<p class="p-lead">${esc(DOMAINS[leadDom].story)}</p>`]},
    {title:"Profil DISC",blocks:[h("03","Gaya perilaku","Profil DISC")+`<div class="chart">${discChart(c)}</div>`,`<div>${styleHead(c)}</div>`,`<div class="p-facets2">${discFacets(c)}</div>`]},
    {title:"Urutan lengkap",blocks:[h("04","Urutan lengkap","Tema 6 sampai 13")+`<p class="muted p-lead">Tema di bagian bawah bukan kelemahan yang harus dipaksa. Itu area yang kurang alami bagi Anda, dan bisa ditutup dengan kebiasaan sederhana atau bekerja sama dengan orang yang kuat di sana.</p>`+rankList(c),`<p class="p-disc">${DISCLAIMER}</p>`]}
  ];
}
function buildPdfPages(c){
  const root=document.createElement("div");root.className="pdf-root";document.body.appendChild(root);
  const pages=[];
  const newPage=(title,cont)=>{
    const pg=document.createElement("div");pg.className="pg";
    pg.innerHTML=`<div class="pg-h"><img src="${LOGO}" alt="RHYS"><span>Talent Profile · ${esc(S.who.n||"Peserta")}</span></div><div class="pg-c">${cont?`<span class="tag p-cont">${esc(title)} · lanjutan</span>`:""}</div><div class="pg-f"><span>RHYS Talent Profile · ${c.date}</span><span class="pg-n"></span></div>`;
    root.appendChild(pg);pages.push(pg);return pg.querySelector(".pg-c");
  };
  pdfSegments(c).forEach(seg=>{
    let box=newPage(seg.title,false);let placed=0;
    seg.blocks.forEach(html=>{
      const t=document.createElement("div");t.className="p-blk";t.innerHTML=html;box.appendChild(t);
      if(box.scrollHeight>box.clientHeight+1&&placed>0){box.removeChild(t);box=newPage(seg.title,true);box.appendChild(t);placed=0}
      placed++;
    });
  });
  pages.forEach((p,i)=>p.querySelector(".pg-n").textContent=`Halaman ${i+1} dari ${pages.length}`);
  return {root,pages};
}
async function makePdf(){
  await pdfLibs();
  try{await document.fonts.ready}catch(e){}
  const c=ctx();const {root,pages}=buildPdfPages(c);
  try{
    const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:"mm",format:"a4",orientation:"portrait",compress:true});
    for(let i=0;i<pages.length;i++){
      const cv=await window.html2canvas(pages[i],{scale:2,backgroundColor:"#ffffff",logging:false,useCORS:true});
      if(i)doc.addPage();doc.addImage(cv.toDataURL("image/jpeg",0.92),"JPEG",0,0,210,297,undefined,"FAST");
    }
    return doc.output("blob");
  }finally{root.remove()}
}
let DL=null;
setTimeout(async()=>{try{DL=await window.claude?.use?.("downloads")}catch(e){DL=null}},0);
let pdfBusy=false,pdfCache=null;
const pdfName=()=>"RHYS-Talent-Profile-"+(S.who.n||"Peserta").trim().replace(/[^\p{L}\p{N}]+/gu,"-").replace(/^-|-$/g,"")+".pdf";
const canShareFiles=(()=>{try{return !!(navigator.canShare&&navigator.canShare({files:[new File(["x"],"x.pdf",{type:"application/pdf"})]}))}catch(e){return false}})();
async function getPdf(){const key=JSON.stringify([S.who,S.ans]);if(pdfCache&&pdfCache.key===key)return pdfCache.blob;const blob=await makePdf();pdfCache={key,blob};return blob}
function setBusy(on){document.querySelectorAll('[data-a="pdf"],[data-a="sharepdf"]').forEach(b=>{if(on){b.dataset.label=b.dataset.label||b.textContent;b.disabled=true;b.textContent="Menyiapkan PDF…"}else{b.disabled=false;b.textContent=b.dataset.label||b.textContent;delete b.dataset.label}})}
function pdfFail(e){
  const code=e&&e.code;const st=document.getElementById("pdf-status");
  if(code==="declined"||(e&&e.name==="AbortError"))toast("Dibatalkan.");
  else if(code==="rate_limited")toast("Tunggu sebentar, lalu coba lagi.");
  else{toast("PDF belum bisa dibuat di perangkat ini.");if(st)st.textContent="PDF belum bisa dibuat di perangkat ini. Coba buka di browser lain, atau screenshot kartu hasil di atas."}
}
async function onPdf(){
  if(pdfBusy)return;pdfBusy=true;setBusy(true);
  try{
    const blob=await getPdf();const name=pdfName();
    if(DL){await DL.save({filename:name,data:blob})}
    else{const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
    toast("PDF tersimpan. Kirim filenya ke "+(S.who.p||"pengundang Anda")+".");
  }catch(e){pdfFail(e)}finally{setBusy(false);pdfBusy=false}
}
async function onSharePdf(btn){
  if(pdfBusy)return;
  const key=JSON.stringify([S.who,S.ans]);
  if(!(pdfCache&&pdfCache.key===key)){
    pdfBusy=true;setBusy(true);
    try{await getPdf()}catch(e){pdfFail(e);setBusy(false);pdfBusy=false;return}
    setBusy(false);pdfBusy=false;
    document.querySelectorAll('[data-a="sharepdf"]').forEach(b=>b.textContent="PDF siap · ketuk untuk bagikan");
    toast("PDF siap. Ketuk sekali lagi untuk membagikan.");return;
  }
  try{await navigator.share({files:[new File([pdfCache.blob],pdfName(),{type:"application/pdf"})],title:"RHYS Talent Profile",text:"Hasil RHYS Talent Profile "+(S.who.n||"")})}
  catch(e){if(!(e&&e.name==="AbortError"))toast("Perangkat ini belum mendukung berbagi file. Gunakan Unduh PDF.")}
}
function toast(t){let el=document.getElementById("toast");if(!el){el=document.createElement("div");el.id="toast";el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}el.textContent=t;el.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("show"),2600)}
async function copySum(){try{await navigator.clipboard.writeText(sumText().replace(/\*/g,""));toast("Ringkasan tersalin")}catch(e){toast("Tidak bisa menyalin otomatis di tampilan ini.")}}

/* ============ DEMO (#contoh) ============ */
function demo(){
  const r=rng(77);const favT=new Set([4,5,6,11,3]);const favD={D:4,I:6,S:1.2,C:1},avoidD={D:.6,I:.4,S:2,C:3};
  const pick=w=>{const ks=Object.keys(w);let x=r()*ks.reduce((a,k)=>a+w[k],0);for(const k of ks){x-=w[k];if(x<0)return k}return ks[ks.length-1]};
  const ans=QUESTIONS.map(q=>{
    if(q.kind==="d"){const km=pick(favD);let kl;do{kl=pick(avoidD)}while(kl===km);return{m:q.opts.findIndex(o=>o.k===km),l:q.opts.findIndex(o=>o.k===kl)}}
    const idx=[0,1,2,3];const fm=idx.filter(j=>favT.has(q.opts[j].k));const m=fm.length?fm[Math.floor(r()*fm.length)]:Math.floor(r()*4);
    const rest=idx.filter(j=>j!==m&&!favT.has(q.opts[j].k));const l=rest.length?rest[Math.floor(r()*rest.length)]:idx.find(j=>j!==m);return{m,l}});
  S={...fresh(),view:"result",who:{n:"Contoh Peserta",p:"Goh Hendro"},ans,demo:true,done:Date.now()};
  render();window.scrollTo({top:0});
}

/* ============ RENDER & EVENTS ============ */
let lastKey="",advT=null;
function render(){
  const v=S.view;const key=v+(v==="q"?S.qi:"");const anim=key!==lastKey;lastKey=key;
  app.innerHTML=v==="q"?vQ():v==="result"?vResult():vIntro();
  if(!anim)app.querySelectorAll(".fade").forEach(el=>el.classList.remove("fade"));
  const f=document.getElementById("who");
  if(f)f.addEventListener("submit",e=>{e.preventDefault();
    const n=document.getElementById("f-n").value.trim(),p=document.getElementById("f-p").value.trim();
    if(n.length<3){document.getElementById("err").textContent="Isi nama lengkap Anda (minimal 3 huruf).";document.getElementById("f-n").focus();return}
    S=fresh();S.who={n,p};go("q")});
}
function go(v){S.view=v;save();render();window.scrollTo({top:0})}
function advance(){if(S.qi<NQ-1){S.qi++;save();render();window.scrollTo({top:0})}else{S.done=Date.now();go("result")}}
app.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
  if(a==="pick"){
    clearTimeout(advT);const x=S.ans[S.qi],j=+b.dataset.j;
    if(x.m==null){x.m=j}
    else if(x.l==null){if(j===x.m)return;x.l=j;save();render();advT=setTimeout(advance,420);return}
    else{x.m=j;x.l=null}
    save();render();return}
  if(a==="reset"){clearTimeout(advT);S.ans[S.qi]={m:null,l:null};save();render();return}
  if(a==="next"){clearTimeout(advT);advance();return}
  if(a==="prev"){clearTimeout(advT);if(S.qi>0){S.qi--;save();render()}else go("intro");return}
  if(a==="resume"){S=load();render();return}
  if(a==="seeresult"){S=load();render();window.scrollTo({top:0});return}
  if(a==="discard"){try{localStorage.removeItem(KEY)}catch(e){}S=fresh();render();return}
  if(a==="pdf"){onPdf();return}
  if(a==="sharepdf"){onSharePdf(b);return}
  if(a==="copysum"){copySum();return}
  if(a==="totop"){window.scrollTo({top:0,behavior:"smooth"});return}
  if(a==="restart"){if(!b.dataset.sure){b.dataset.sure="1";b.textContent="Yakin? Hasil akan terhapus. Ketuk lagi";return}
    try{localStorage.removeItem(KEY)}catch(e){}S=fresh();if(location.hash==="#contoh")history.replaceState(null,"",location.pathname+location.search);go("intro");return}
});
function route(){if(location.hash==="#contoh")demo()}
window.addEventListener("hashchange",route);
function start(data){if(data&&data.view&&data.ans&&data.ans.length===NQ)S=data;render();route()}
window.claude?.hot?.snapshot?.(()=>S);
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
